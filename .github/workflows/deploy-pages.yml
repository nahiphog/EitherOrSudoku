name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_GITHUB_PAGES_BASE: /EitherOrSudoku
      # Vinext writes prefixed static assets below the project-name directory,
      # while the HTML correctly requests them below the Pages site root.
      # Mirror that directory into the artifact root so those URLs resolve.
      - name: Place static assets at the Pages base path
        run: cp -R dist/client/EitherOrSudoku/_next dist/client/_next
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
